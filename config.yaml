# ─────────────────────────────────────────────────────────────
#  Менеджер профилей: изолированный браузер на аккаунт + данные под рукой.
#  Личные правки клади в config.local.yaml — он перекрывает этот файл
#  и не конфликтует с git pull.
# ─────────────────────────────────────────────────────────────

paths:
  accounts: accounts.txt     # login:pass:mail:mailpassword
  proxies: proxies.txt       # пул прокси, порядок строк не важен
  mafiles: mafiles           # maFile'ы, сопоставление по account_name внутри файла
  profiles: profiles         # профили браузера, по одному на аккаунт
  state: state               # cookies и закреплённые отпечатки
  data: data                 # привязки аккаунт-прокси, пометки
  logs: logs

browser:
  engine: camoufox           # camoufox | firefox | chromium
  persistent_profile: true   # профиль на аккаунт, а не только cookies
  pin_fingerprint: true      # отпечаток закрепляется за аккаунтом навсегда
  start_url: https://csfloat.com    # что открыть при старте профиля (null — пустая вкладка)
  os: [windows]              # какие ОС подделывать
  humanize: true             # человекоподобные движения курсора
  geoip: true                # locale и таймзона по IP прокси
  block_images: false        # для ручной работы картинки нужны
  locale: en-US
  timezone: null             # null = из geoip
  enable_cache: true
  disable_ublock: false
  executable_path: null      # путь к своему бинарнику браузера
  firefox_prefs: {}          # напр. network.http.http3.enable: false
  virtual_display: auto      # auto|true|false — Xvfb для Linux без GUI
  viewports:
    - [1280, 800]
    - [1366, 768]
    - [1440, 900]
    - [1536, 864]
    - [1920, 1080]
  user_agents: []            # пусто = фингерпринт генерирует движок

proxy:
  default_scheme: http       # если в строке прокси нет схемы
  relay_socks_auth: true     # socks5 с авторизацией -> локальный релей
  relay_host: 127.0.0.1

timeouts:
  page_load_ms: 120000
  action_ms: 30000

steam:
  time_sync: true            # синхронизация времени для кодов Steam Guard
  time_sync_url: https://api.steampowered.com/ITwoFactorService/QueryTime/v0001/

web:
  host: 127.0.0.1            # наружу не выставлять: в интерфейсе пароли
  port: 8000
  token: null                # если задан, нужен ?token=... в адресе
